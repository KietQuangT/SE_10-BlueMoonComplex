name: Backend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bluemoon
          MYSQL_USER: bluemoon
          MYSQL_PASSWORD: ci_fixture_password
          MYSQL_ROOT_PASSWORD: ci_fixture_root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_fixture_root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build và kiểm thử với MySQL
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: bluemoon
          DB_USER: bluemoon
          DB_PASSWORD: ci_fixture_password
        run: ./mvnw -B -ntp -Pintegration verify
