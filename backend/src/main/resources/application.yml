spring:
  application:
    name: bluemoon-backend
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bluemoon}?connectionTimeZone=UTC
    username: ${DB_USER:bluemoon}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
